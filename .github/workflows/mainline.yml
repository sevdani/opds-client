# Mainline workflow - CI and Release
name: CI & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_level:
        description: 'Force version bump level (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease

# Default permissions
permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[release]"

      - name: Run pytest with coverage
        run: pytest -v --cov=opds_client --cov-report=term-missing

      - name: Run mypy type checking
        run: mypy opds_client

      - name: Run ruff linter
        run: ruff check .

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[release]"

      - name: Configure git user
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"


      - name: Determine version and create release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          build: true
          publish: false
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          force: ${{ github.event.inputs.force_level }}

      - name: Verify version consistency
        run: |
          # Extract version from pyproject.toml
          pyproject_version=$(grep -E "^version = " pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          
          # Get the latest tag
          latest_tag=$(git describe --tags --abbrev=0)
          
          # Clean tag name (remove 'v' prefix if present)
          clean_tag=$(echo "$latest_tag" | sed 's/^v//')
          
          echo "Version from pyproject.toml: $pyproject_version"
          echo "Latest tag: $latest_tag (clean: $clean_tag)"
          
          if [ "$pyproject_version" != "$clean_tag" ]; then
            echo "ERROR: Version mismatch! pyproject.toml has $pyproject_version but tag is $clean_tag"
            exit 1
          fi
          
          echo "✓ Version consistency verified: $pyproject_version"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true

      - name: Upload to GitHub Packages
        run: |
          # Upload to GitHub Packages requires authentication
          # Using the same PyPI publish action with custom index-url
          # GitHub Packages PyPI URL: https://pypi.pkg.github.com/${{ github.repository_owner }}/
          echo "GitHub Packages upload handled via pypa/gh-action-pypi-publish"
          # Note: For GitHub Packages, configure PyPI config or use twine
          # See: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-pypi-registry

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distribution-artifacts
          path: dist
          retention-days: 7

  docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          zensical build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
