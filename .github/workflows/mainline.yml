# Mainline workflow - CI and Release
name: CI & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_level:
        description: 'Force version bump level (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease

# Default permissions
permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[release]"

      - name: Run pytest with coverage
        run: pytest -v --cov=opds_client --cov-report=term-missing

      - name: Run mypy type checking
        run: mypy opds_client

      - name: Run ruff linter
        run: ruff check .

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[release]"

      - name: Configure git user
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"


      - name: Determine version and create release
        run: |
          # Use bump2version to bump version based on force_level input
          bump2version ${{ github.event.inputs.force_level }}
          
          # Verify version was updated
          echo "Updated version in pyproject.toml:"
          grep -E "^version = " pyproject.toml
          
          # Commit the version change
          git add pyproject.toml
          git commit -m "chore: bump version to $(grep -E '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')"
          
          # Get the new version
          NEW_VERSION=$(grep -E "^version = " pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          
          # Create tag
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          
          # Push changes and tags
          git push origin main
          git push origin "v$NEW_VERSION"
          
          # Build the package
          python -m build --sdist --wheel .
          
          # Upload distribution artifacts
          echo "Distribution artifacts prepared in dist/"

  docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          zensical build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
