# Mainline workflow - CI and Release
name: CI & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_level:
        description: 'Force version bump level (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease

# Default permissions
permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[release]"

      - name: Run pytest with coverage
        run: pytest -v --cov=opds_client --cov-report=term-missing

      - name: Run mypy type checking
        run: mypy opds_client

      - name: Run ruff linter
        run: ruff check .

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[release]"

      - name: Configure git user
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Bump version and create tag
        run: |
          # Fetch all tags first
          git fetch --tags
          
          # Use bump2version to bump version based on force_level input
          # Use --allow-dirty to force bump even if git thinks we're clean
          bump2version --allow-dirty ${{ github.event.inputs.force_level }}
          
          # Verify version was updated
          echo "Updated version in pyproject.toml:"
          grep -E "^version = " pyproject.toml
          
          # Get the new version (from bump2version output or from file)
          NEW_VERSION=$(grep -E "^version = " pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          
          # Push changes and tags (bump2version already committed)
          git push origin main
          git push origin "v$NEW_VERSION"

      - name: Build package
        run: python -m build --sdist --wheel .

      - name: Verify version consistency
        run: |
          # Extract version from pyproject.toml
          pyproject_version=$(grep -E "^version = " pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          
          # Extract version from the built wheel
          wheel_file=$(find dist -name "*.whl" -type f | head -1)
          wheel_version=$(unzip -p "$wheel_file" "*dist-info/METADATA" | grep "^Version:" | head -1 | sed 's/Version: //')
          
          # Get the version from the tag we just created (from pyproject.toml value)
          clean_tag="$pyproject_version"
          latest_tag="v$clean_tag"
          
          echo "Version from pyproject.toml: $pyproject_version"
          echo "Version from wheel metadata: $wheel_version"
          echo "Latest tag: $latest_tag (clean: $clean_tag)"
          
          if [ "$pyproject_version" != "$wheel_version" ]; then
            echo "ERROR: Version mismatch! pyproject.toml has $pyproject_version but wheel has $wheel_version"
            exit 1
          fi
          
          if [ "$pyproject_version" != "$clean_tag" ]; then
            echo "ERROR: Version mismatch! pyproject.toml has $pyproject_version but tag is $clean_tag"
            exit 1
          fi
          
          echo "✓ Version consistency verified: $pyproject_version"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: distribution-artifacts
          path: dist
          retention-days: 7

  docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          zensical build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
