# Features workflow - CI only (no release)
name: CI - Features

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'perf/**'

# Default permissions
permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest -v --cov=opds_client --cov-report=term-missing

      - name: Run mypy type checking
        run: mypy opds_client

      - name: Run ruff linter
        run: ruff check .
