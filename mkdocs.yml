site_name: OPDS Client
site_description: Python library for working with OPDS catalogs
site_url: https://sevdani.github.io/opds-client

repo_url: https://github.com/sevdani/opds-client
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/logo-white.svg
  favicon: assets/favicon.ico
  static_dir:
    - assets
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: true
            heading_level: 2
            members_order: source
            separate_signature: true
            docstring_section_style: list

markdown_extensions:
  - toc:
      toc_depth: 3
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - OPDS 2.0 Guide: opds2.md
  - OPDS 1.2 Guide: opds12.md
  - Usage Examples: examples.md
  - API Reference: api.md
  - Development: development.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sevdani/opds-client
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/opds-client
